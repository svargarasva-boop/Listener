        &copy; 2026 СЛУШАТЕЛЬ.онлайн. Все права защищены.
    </footer>

    <script>
        let selectedTariffText = 'Супер-короткий звонок (3 минуты) за 3 USD'; 

        function selectTariff(tariffId, tariffText) {
            document.getElementById('t1').classList.remove('active', 'thunder');
            document.getElementById('t2').classList.remove('active', 'thunder');
            document.getElementById('t3').classList.remove('active', 'thunder');
            document.getElementById('t4').classList.remove('active', 'thunder');
            document.getElementById('t5').classList.remove('active', 'thunder');
            document.getElementById('t6').classList.remove('active', 'thunder');
            
            selectedTariffText = tariffText;
            const element = document.getElementById(tariffId);
            
            if (tariffId === 't6') {
                element.classList.add('active', 'thunder');
            } else {
                element.classList.add('active');
            }
            document.getElementById('radio-' + tariffId).checked = true;
        }

        function redirectToTelegram() {
            const message = "Здравствуйте! Я хочу заказать сессию. Выбранный тариф: " + selectedTariffText;
            const telegramUrl = "https://t.me";
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(message).then(() => {
                    alert("Название тарифа скопировано! Пожалуйста, вставьте его в чате (Ctrl+V или долгий тап -> Вставить).");
                    window.open(telegramUrl, '_blank');
                }).catch(() => {
                    window.open(telegramUrl, '_blank');
                });
            } else {
                window.open(telegramUrl, '_blank');
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessageToSmartAI();
            }
        }

        function sendMessageToSmartAI() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            const chatMessages = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = "msg bot";
            loadingDiv.id = "ai-loading-status";
            loadingDiv.style = "background-color: #1e293b; color: #94a3b8; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; line-height: 1.4; margin-right: 20px;";
            loadingDiv.innerText = "ИИ подбирает ответ...";
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            setTimeout(() => {
                const statusEl = document.getElementById("ai-loading-status");
                if (statusEl) statusEl.remove();
                const botResponse = generateLocalAIResponse(text);
                appendMessage(botResponse, 'bot');
            }, 500);
        }

        function appendMessage(text, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg " + sender;
            msgDiv.style = sender === 'user' 
                ? "background-color: #818cf8; color: #ffffff; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; line-height: 1.4; margin-left: 20px; text-align: right;" 
                : "background-color: #1e293b; color: #f1f5f9; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; line-height: 1.4; margin-right: 20px;";
            msgDiv.innerText = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function generateLocalAIResponse(input) {
            const query = input.toLowerCase();

            if (query.includes('час') || query.includes('60 мин') || query.includes('длинн') || query.includes('дольше')) {
                return "Да, вы можете заказать сессию на 1 час или даже дольше. На сайте указаны базовые тарифы до 30 минут, но индивидуальное время мы легко согласуем. Перейдите в Telegram, и мы подберем удобный для вас слот.";
            }
            if (query.includes('тариф') || query.includes('цен') || query.includes('сколько стоит') || query.includes('стоимость') || query.includes('деньг') || query.includes('плат')) {
                return "У нас действуют гибкие тарифы: от коротких звонков по 3, 5, 10 и 15 минут до полноценных сессий на 30 минут. Также есть специальный тариф «Громоотвод» за 50 USD. Выбирайте любой прямо на странице!";
            }
            if (query.includes('аноним') || query.includes('секрет') || query.includes('данные') || query.includes('узнает') || query.includes('конфиденц') || query.includes('безопасн')) {
                return "Ваша анонимность — наш главный приоритет. Сервис не требует никаких регистраций, указания имен или телефонов. Диалог идет напрямую в Telegram, переписка нигде не сохраняется и не передается третьим лицам.";
            }
            if (query.includes('громоотвод') || query.includes('орать') || query.includes('злить') || query.includes('руга') || query.includes('крича') || query.includes('мат')) {
                return "Тариф «Громоотвод» за 50 USD создан как раз для того, чтобы выплеснуть сильные эмоции. На этой сессии вам разрешено кричать, плакать, ругаться и сливать злость. Слушатель примет любой ваш шторм без осуждения.";
            }
            if (query.includes('как заказать') || query.includes('как начать') || query.includes('купить') || query.includes('заказ') || query.includes('кнопк')) {
                return "Всё просто: кликните по нужному тарифу в карточке выше (он выделится рамкой), а затем нажмите кнопку «Заказать сессию через Telegram». Название тарифа скопируется, и вы перейдете в чат.";
            }
            if (query.includes('кто ты') || query.includes('ты человек') || query.includes('бот') || query.includes('робот')) {
                return "Я — текстовый ассистент сайта, помогающий сориентироваться в правилах. Но общаться вы будете с живым, понимающим человеком — вашим Слушателем, который не станет вас перебивать или учить жизни.";
            }
            if (query.includes('правил') || query.includes('можно') || query.includes('нельзя') || query.includes('ограничен')) {
                return "Главное правило — конфиденциальность и свобода выражения чувств. Вы можете говорить о чем угодно. Единственное ограничение — на тарифе «Громоотвод» нельзя переходить на прямые угрозы или личные оскорбления самого Слушателя.";
            }
            if (query.includes('привет') || query.includes('здравствуй') || query.includes('добрый день') || query.includes('ку')) {
                return "Здравствуйте! Я ваш линейный помощник. Спросите меня о ценах, анонимности, длительности сессий или о том, как устроен «Громоотвод».";
            }
            if (query.includes('спасибо') || query.includes('благодар') || query.includes('понятно') || query.includes('хорошо')) {
                return "Рад помочь! Если вы чувствуете, что накопилось и нужно выговориться — выбирайте подходящее время в карточке выше и переходите в чат.";
            }

            return "Мы создали этот сервис, чтобы вы могли безопасно разделить любые свои мысли и переживания, не боясь критики. Нажмите кнопку заказа, перейдите к нам в Telegram, и Слушатель ответит на этот вопрос подробно лично в чате.";
        }

        function shareWebsite() {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            if (isMobile && navigator.share) {
                navigator.share({
                    title: 'Твой Слушатель',
                    text: 'Сервис конфиденциальной поддержки. Иногда нужно просто выговориться.',
                    url: window.location.href
                }).catch(() => {});
            } else {
                const modal = document.getElementById('customShareModal');
                if (modal) modal.style.display = 'flex';
            }
        }

        function closeShareModal() {
            const modal = document.getElementById('customShareModal');
            if (modal) modal.style.display = 'none';
        }

        function copyShareLink() {
            const linkInput = document.getElementById('shareLinkInput');
            if (linkInput) {
                navigator.clipboard.writeText(linkInput.value).then(() => {
                    const btn = document.querySelector('.modal-copy-btn');
                    if (btn) {
                        btn.textContent = 'Скопировано!';
                        setTimeout(() => { btn.textContent = 'Копировать'; }, 2000);
                    }
                });
            }
        }
    </script>
</body>
</html>
